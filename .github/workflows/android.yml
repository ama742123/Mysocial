name: Build Android App (.aab & .apk)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install

    - name: Add Capacitor Android Platform
      run: |
        npx cap add android
        npx cap sync android

    - name: Build Android Bundle (.aab) & APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease
        ./gradlew assembleDebug

    - name: Upload Release Bundle (.aab for Play Store)
      uses: actions/upload-artifact@v4
      with:
        name: mysocial-playstore-aab
        path: android/app/build/outputs/bundle/release/app-release.aab

    - name: Upload Debug APK (for Testing on Mobile)
      uses: actions/upload-artifact@v4
      with:
        name: mysocial-test-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
