<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>mysocial - Social Media App</title>
  
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @keyframes logoPop {
      0% { transform: scale(0.6); opacity: 0; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes textFadeUp {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-logo { animation: logoPop 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .animate-text { animation: textFadeUp 1s ease-out 0.4s forwards; opacity: 0; }

    .reaction-box {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0;
      background: white;
      border-radius: 9999px;
      padding: 4px 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 20;
    }
    .group:hover .reaction-box { display: flex; }
    
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-12">

  <!-- Splash Screen -->
  <div id="splash-screen" class="fixed inset-0 bg-white z-[100] flex flex-col justify-between items-center py-12 transition-opacity duration-500">
    <div></div>
    <div class="flex flex-col items-center animate-logo">
      <div class="w-20 h-20 rounded-2xl shadow-md border border-gray-100 flex items-center justify-center bg-blue-600">
        <span class="text-white font-black text-4xl tracking-tight">M</span>
      </div>
    </div>
    <div class="flex flex-col items-center animate-text space-y-1">
      <span class="text-[11px] text-gray-400 font-medium tracking-widest uppercase">from</span>
      <h1 class="text-xl font-black text-blue-600 tracking-wider">mysocial</h1>
    </div>
  </div>

  <!-- Header & Navigation -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="px-4 py-2.5 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-blue-600 tracking-wide">mysocial</h1>
      <div class="flex space-x-2 items-center">
        <span id="user-display-name" class="text-xs font-semibold text-gray-600"></span>
        <button id="logout-btn" onclick="handleLogout()" class="hidden text-xs bg-red-100 text-red-600 px-2.5 py-1 rounded-md font-semibold">Logout</button>
      </div>
    </div>

    <nav class="flex justify-around border-t border-gray-100 text-gray-500 font-medium">
      <button onclick="switchTab('home')" id="nav-home" class="w-full py-2.5 text-blue-600 border-b-2 border-blue-600 flex justify-center items-center">
        <i class="fa-solid fa-house text-xl"></i>
      </button>
      <button onclick="switchTab('reels')" id="nav-reels" class="w-full py-2.5 hover:text-blue-600 flex justify-center items-center">
        <i class="fa-solid fa-clapperboard text-xl"></i>
      </button>
      <button onclick="switchTab('friends')" id="nav-friends" class="w-full py-2.5 hover:text-blue-600 flex justify-center items-center">
        <i class="fa-solid fa-user-group text-xl"></i>
      </button>
      <button onclick="switchTab('notifications')" id="nav-notif" class="w-full py-2.5 hover:text-blue-600 flex justify-center items-center">
        <i class="fa-solid fa-bell text-xl"></i>
      </button>
      <button onclick="switchTab('settings')" id="nav-settings" class="w-full py-2.5 hover:text-blue-600 flex justify-center items-center">
        <i class="fa-solid fa-gear text-xl"></i>
      </button>
    </nav>
  </header>

  <!-- Auth Container -->
  <div id="auth-container" class="max-w-md mx-auto my-6 p-6 bg-white rounded-xl shadow-sm border border-gray-100">
    <div class="text-center mb-5">
      <h2 class="text-2xl font-extrabold text-blue-600" id="auth-title">Welcome to mysocial</h2>
      <p class="text-xs text-gray-500 mt-1" id="auth-subtitle">Connect with friends and the world around you.</p>
    </div>
    
    <div class="space-y-3.5">
      <div id="name-field" class="hidden">
        <input type="text" id="auth-name" placeholder="Full Name" class="w-full border border-gray-300 px-3.5 py-2 rounded-lg text-sm outline-none focus:border-blue-600">
      </div>
      <div>
        <input type="text" id="auth-email-phone" placeholder="Email address or Mobile number" class="w-full border border-gray-300 px-3.5 py-2 rounded-lg text-sm outline-none focus:border-blue-600">
      </div>
      <div class="relative">
        <input type="password" id="auth-password" placeholder="Password" class="w-full border border-gray-300 px-3.5 py-2 rounded-lg text-sm outline-none focus:border-blue-600 pr-10">
        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600 text-sm">
          <i id="password-toggle-icon" class="fa-solid fa-eye"></i>
        </button>
      </div>
      <button onclick="handleAuth()" id="auth-submit-btn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-bold hover:bg-blue-700 transition">Log In</button>
      <div class="flex items-center my-3">
        <div class="flex-grow border-t border-gray-200"></div>
        <span class="px-2 text-xs text-gray-400 font-medium">OR</span>
        <div class="flex-grow border-t border-gray-200"></div>
      </div>
      <button onclick="handleGoogleLogin()" class="w-full border border-gray-300 bg-white text-gray-700 py-2.5 rounded-lg text-sm font-semibold hover:bg-gray-50 flex items-center justify-center space-x-2 transition">
        <i class="fa-brands fa-google text-red-500 text-base"></i>
        <span>Continue with Google</span>
      </button>
    </div>

    <div class="mt-5 pt-4 border-t border-gray-100 flex justify-between items-center text-xs">
      <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="text-blue-600 font-bold hover:underline">Create new account</button>
      <button onclick="showForgotPassword()" id="forgot-password-btn" class="text-gray-500 hover:text-blue-600 hover:underline">Forgot password?</button>
    </div>
  </div>
    <!-- App Content -->
  <div id="app-content" class="hidden">
    <!-- Home Tab -->
    <main id="view-home" class="max-w-md mx-auto p-2 space-y-3">
      <div class="bg-white p-3 rounded-lg shadow-sm space-y-2 border border-gray-200">
        <div class="flex items-center space-x-2">
          <div id="user-avatar" class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm">U</div>
          <input type="text" id="post-input" placeholder="What's on your mind?" class="w-full bg-gray-100 rounded-full px-4 py-2 text-sm outline-none border hover:bg-gray-200 focus:bg-white focus:border-blue-500 transition">
        </div>
        <div class="flex justify-end pt-1">
          <button onclick="createPost()" class="bg-blue-600 text-white px-5 py-1.5 rounded-full text-xs font-bold hover:bg-blue-700 transition">Post</button>
        </div>
      </div>

      <div class="flex justify-between items-center px-1 text-xs text-gray-500">
        <span class="font-semibold"><i class="fa-solid fa-sliders text-blue-600 mr-1"></i> Personalized Feed</span>
        <button onclick="loadPersonalizedFeed(true)" class="hover:text-blue-600"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
      </div>

      <div id="posts-container" class="space-y-3">
        <p class="text-center text-xs text-gray-400 py-4">Ranking posts for you...</p>
      </div>

      <div class="text-center pt-2">
        <button id="load-more-btn" onclick="loadPersonalizedFeed(false)" class="hidden bg-gray-200 text-gray-700 text-xs px-4 py-2 rounded-full font-semibold hover:bg-gray-300">Load More Posts</button>
      </div>
    </main>

    <!-- Reels Tab -->
    <div id="view-reels" class="hidden max-w-md mx-auto h-[calc(100vh-110px)] bg-black relative overflow-hidden flex flex-col">
      <div class="absolute top-2 right-4 z-30">
        <button onclick="openUploadModal()" class="bg-white/25 backdrop-blur-md text-white px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center space-x-1.5 hover:bg-white/35 transition shadow-sm">
          <i class="fa-solid fa-plus text-[10px]"></i>
          <span>Upload Reel</span>
        </button>
      </div>

      <div id="reels-container" class="h-full overflow-y-scroll snap-y snap-mandatory scrollbar-none">
        <div class="h-full flex items-center justify-center text-gray-400 text-xs">
          Loading reels...
        </div>
      </div>
    </div>

    <!-- Upload Reel Modal -->
    <div id="reel-upload-modal" class="hidden fixed inset-0 bg-black/70 z-[110] flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-sm rounded-2xl p-4 space-y-3 shadow-xl">
        <h3 class="font-bold text-sm text-gray-800">Upload New Reel</h3>
        <input type="text" id="reel-video-url" placeholder="Enter Video URL (MP4)" class="w-full border rounded-lg px-3 py-2 text-xs outline-none focus:border-blue-600">
        <input type="text" id="reel-caption" placeholder="Write a caption..." class="w-full border rounded-lg px-3 py-2 text-xs outline-none focus:border-blue-600">
        <div class="flex justify-end space-x-2 pt-2">
          <button onclick="closeUploadModal()" class="px-3 py-1.5 text-xs text-gray-600 font-semibold">Cancel</button>
          <button onclick="uploadReel()" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold">Post Reel</button>
        </div>
      </div>
    </div>

    <!-- Friends & Follow Tab -->
    <div id="view-friends" class="hidden max-w-md mx-auto p-4 space-y-3">
      <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-sm font-bold text-gray-800 mb-2"><i class="fa-solid fa-user-plus text-blue-600 mr-1"></i> Discover People & Friends</h2>
        <div id="suggested-users-container" class="space-y-2 pt-1">
          <p class="text-xs text-gray-400 text-center py-2">Loading users...</p>
        </div>
      </div>
    </div>

    <!-- Notifications Tab -->
    <div id="view-notifications" class="hidden max-w-md mx-auto p-4 bg-white mt-4 rounded-lg shadow-sm text-center">
      <h2 class="text-lg font-bold">Notifications</h2>
      <p class="text-sm text-gray-500 mt-2">No new notifications.</p>
    </div>

    <!-- Settings Tab -->
    <div id="view-settings" class="hidden max-w-md mx-auto p-4 bg-white mt-4 rounded-lg shadow-sm">
      <h2 class="text-lg font-bold mb-4">App Settings</h2>
      <div class="flex items-center justify-between py-3 border-b">
        <span class="text-sm font-medium">Change Language:</span>
        <select id="lang-selector" onchange="changeLanguage(this.value)" class="border rounded-md px-3 py-1.5 text-sm bg-gray-50">
          <option value="en" selected>English</option>
          <option value="bn">বাংলা (Bengali)</option>
        </select>
      </div>
    </div>
  </div>
    <!-- Firebase & App Logic Engine (Part A) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
      signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail, 
      onAuthStateChanged, signOut, updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, getDocs, getDoc,
      query, orderBy, limit, startAfter, serverTimestamp, 
      doc, setDoc, deleteDoc, updateDoc, increment, arrayUnion, arrayRemove 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBPZ5J4zXZ54UX22rMryU2AT5buy5oOfNo",
      authDomain: "mysocial-7a273.firebaseapp.com",
      databaseURL: "https://mysocial-7a273-default-rtdb.firebaseio.com",
      projectId: "mysocial-7a273",
      storageBucket: "mysocial-7a273.firebasestorage.app",
      messagingSenderId: "25826997817",
      appId: "1:25826997817:web:08b203b0489469b809bfe8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isRegisterMode = false;
    let currentUser = null;
    let userProfile = { following: [], hiddenPosts: [], affinity: {} };
    let lastVisibleDoc = null;
    const PAGE_SIZE = 15;

    const FEED_WEIGHTS = { FOLLOW: 40, RECENCY: 30, ENGAGEMENT: 15, AFFINITY: 15 };

    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }
    }, 1800);

    window.togglePasswordVisibility = () => {
      const pwdInput = document.getElementById('auth-password');
      const icon = document.getElementById('password-toggle-icon');
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        pwdInput.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    };

    window.toggleAuthMode = () => {
      isRegisterMode = !isRegisterMode;
      document.getElementById('name-field').classList.toggle('hidden', !isRegisterMode);
      document.getElementById('auth-title').innerText = isRegisterMode ? "Create a new account" : "Welcome to mysocial";
      document.getElementById('auth-submit-btn').innerText = isRegisterMode ? "Sign Up" : "Log In";
      document.getElementById('toggle-auth-btn').innerText = isRegisterMode ? "Already have an account? Log In" : "Create new account";
      document.getElementById('forgot-password-btn').classList.toggle('hidden', isRegisterMode);
    };

    function parseInputToEmail(inputVal) {
      inputVal = inputVal.trim();
      if (inputVal.includes('@')) return inputVal;
      const cleanPhone = inputVal.replace(/[^0-9]/g, '');
      if (cleanPhone.length >= 10) return `${cleanPhone}@mysocial.phone`;
      return null;
    }

    window.handleAuth = async () => {
      const rawInput = document.getElementById('auth-email-phone').value;
      const password = document.getElementById('auth-password').value;
      const fullName = document.getElementById('auth-name').value.trim();
      const email = parseInputToEmail(rawInput);

      if (!email) return alert("Please enter a valid Email address or Mobile number.");
      if (!password || password.length < 6) return alert("Password must be at least 6 characters long.");

      try {
        if (isRegisterMode) {
          if (!fullName) return alert("Please enter your Full Name.");
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;
          await updateProfile(user, { displayName: fullName });
          await setDoc(doc(db, "users", user.uid), { uid: user.uid, name: fullName, email: user.email, following: [], hiddenPosts: [], createdAt: serverTimestamp() });
          alert("Account created successfully!");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        alert("Authentication Error: " + error.message);
      }
    };

    window.handleGoogleLogin = async () => {
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid, name: user.displayName || "Google User", email: user.email, photoURL: user.photoURL || "", following: [], hiddenPosts: [], createdAt: serverTimestamp()
        }, { merge: true });
      } catch (error) {
        alert("Google Login Error: " + error.message);
      }
    };

    window.showForgotPassword = async () => {
      const rawInput = prompt("Enter your registered Email address:");
      if (!rawInput) return;
      const email = parseInputToEmail(rawInput);
      if (!email || email.endsWith('@mysocial.phone')) return alert("Please enter a valid registered email address.");
      try {
        await sendPasswordResetEmail(auth, email);
        alert("Password reset email sent!");
      } catch (error) {
        alert("Error: " + error.message);
      }
    };

    window.handleLogout = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('auth-container').classList.add('hidden');
        document.getElementById('app-content').classList.remove('hidden');
        document.getElementById('logout-btn').classList.remove('hidden');
        
        const showName = user.displayName || user.email.split('@')[0];
        document.getElementById('user-display-name').innerText = showName;
        document.getElementById('user-avatar').innerText = showName[0].toUpperCase();

        await loadUserProfile();
        loadPersonalizedFeed(true);
        loadSuggestedUsers();
      } else {
        document.getElementById('auth-container').classList.remove('hidden');
        document.getElementById('app-content').classList.add('hidden');
        document.getElementById('logout-btn').classList.add('hidden');
      }
    });

    async function loadUserProfile() {
      if (!currentUser) return;
      try {
        const userSnap = await getDoc(doc(db, "users", currentUser.uid));
        if (userSnap.exists()) {
          const data = userSnap.data();
          userProfile.following = data.following || [];
          userProfile.hiddenPosts = data.hiddenPosts || [];
        }
      } catch (e) {
        console.error("Error loading profile signals:", e);
      }
    }

    window.toggleFollowUser = async (targetUid) => {
      if (!currentUser) return;
      const isFollowing = userProfile.following.includes(targetUid);
      
      try {
        const userRef = doc(db, "users", currentUser.uid);
        if (isFollowing) {
          userProfile.following = userProfile.following.filter(id => id !== targetUid);
          await updateDoc(userRef, { following: arrayRemove(targetUid) });
        } else {
          userProfile.following.push(targetUid);
          await updateDoc(userRef, { following: arrayUnion(targetUid) });
        }
        loadSuggestedUsers();
        loadPersonalizedFeed(true);
      } catch (e) {
        alert("Follow action failed: " + e.message);
      }
    };
        async function loadSuggestedUsers() {
      const container = document.getElementById('suggested-users-container');
      if (!container) return;
      container.innerHTML = `<p class="text-xs text-gray-400 text-center py-2">Loading users...</p>`;

      try {
        const snapshot = await getDocs(collection(db, "users"));
        container.innerHTML = "";
        let count = 0;

        snapshot.forEach((docSnap) => {
          const userData = docSnap.data();
          if (userData.uid && userData.uid !== currentUser.uid) {
            count++;
            const isFollowing = userProfile.following.includes(userData.uid);
            const name = userData.name || "User";

            const userHtml = `
              <div class="flex items-center justify-between p-2 bg-gray-50 rounded-lg border border-gray-100 text-xs">
                <div class="flex items-center space-x-2">
                  <div class="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs">
                    ${name[0].toUpperCase()}
                  </div>
                  <span class="font-semibold text-gray-800">${name}</span>
                </div>
                <button onclick="toggleFollowUser('${userData.uid}')" class="px-3 py-1 rounded-md font-bold transition ${isFollowing ? 'bg-gray-200 text-gray-700 hover:bg-gray-300' : 'bg-blue-600 text-white hover:bg-blue-700'}">
                  ${isFollowing ? 'Following' : 'Follow'}
                </button>
              </div>
            `;
            container.innerHTML += userHtml;
          }
        });

        if (count === 0) {
          container.innerHTML = `<p class="text-xs text-gray-400 text-center py-2">No other users found.</p>`;
        }
      } catch (e) {
        console.error("Error loading users:", e);
        container.innerHTML = `<p class="text-xs text-red-400 text-center py-2">Failed to load users.</p>`;
      }
    }

    function calculatePostScore(post) {
      const authorId = post.authorId || post.userUid;
      const isFollowing = userProfile.following.includes(authorId) ? 1.0 : 0.2;
      const followScore = isFollowing * FEED_WEIGHTS.FOLLOW;

      const now = Date.now();
      const postTime = post.createdAt ? post.createdAt.toMillis() : now;
      const ageInHours = Math.max(0, (now - postTime) / (1000 * 60 * 60));
      const recencyScore = Math.exp(-0.03 * ageInHours) * FEED_WEIGHTS.RECENCY;

      const likes = Object.keys(post.reactions || {}).length;
      const comments = post.commentCount || 0;
      const shares = post.shareCount || 0;
      const rawEngagement = (likes * 1) + (comments * 2) + (shares * 3);
      const engagementScore = Math.min(1.0, rawEngagement / 20) * FEED_WEIGHTS.ENGAGEMENT;

      const affinityVal = userProfile.affinity[authorId] || 0;
      const affinityScore = Math.min(1.0, affinityVal / 10) * FEED_WEIGHTS.AFFINITY;

      return followScore + recencyScore + engagementScore + affinityScore;
    }

    window.loadPersonalizedFeed = async (isReset = false) => {
      const postsContainer = document.getElementById('posts-container');
      const loadMoreBtn = document.getElementById('load-more-btn');
      
      if (isReset) {
        lastVisibleDoc = null;
        postsContainer.innerHTML = `<p class="text-center text-xs text-gray-400 py-4">Ranking posts for you...</p>`;
      }

      try {
        let q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(PAGE_SIZE));
        if (!isReset && lastVisibleDoc) {
          q = query(collection(db, "posts"), orderBy("createdAt", "desc"), startAfter(lastVisibleDoc), limit(PAGE_SIZE));
        }

        const snapshot = await getDocs(q);
        if (snapshot.empty && isReset) {
          postsContainer.innerHTML = `<p class="text-center text-xs text-gray-400 py-4">No posts available right now.</p>`;
          loadMoreBtn.classList.add('hidden');
          return;
        }

        if (snapshot.docs.length > 0) {
          lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
        }

        let fetchedPosts = [];
        snapshot.forEach((docSnap) => {
          const postId = docSnap.id;
          const postData = docSnap.data();

          if (!userProfile.hiddenPosts.includes(postId)) {
            const score = calculatePostScore(postData);
            fetchedPosts.push({ id: postId, ...postData, score });
          }
        });

        fetchedPosts.sort((a, b) => b.score - a.score);

        if (isReset) postsContainer.innerHTML = "";

        fetchedPosts.forEach((post) => {
          renderSinglePost(post);
        });

        loadMoreBtn.classList.toggle('hidden', snapshot.docs.length < PAGE_SIZE);

      } catch (e) {
        console.error("Feed error:", e);
        postsContainer.innerHTML = `<p class="text-center text-xs text-red-400 py-4">Failed to load feed. Please try again.</p>`;
      }
    };

    const reactionIcons = { like: "👍", love: "❤️", haha: "😆", wow: "😮", sad: "😢", angry: "😡" };

    function renderSinglePost(post) {
      const postsContainer = document.getElementById('posts-container');
      const authorId = post.authorId || post.userUid;
      const isOwner = currentUser && currentUser.uid === authorId;
      const authorName = post.userName || "User";

      const reactions = post.reactions || {};
      const reactionCounts = Object.values(reactions).reduce((acc, r) => { acc[r] = (acc[r] || 0) + 1; return acc; }, {});
      const totalReactions = Object.keys(reactions).length;
      const myReaction = currentUser ? reactions[currentUser.uid] : null;

      const postHtml = `
        <article id="post-card-${post.id}" class="bg-white rounded-lg shadow-sm p-3 border border-gray-200">
          <div class="flex justify-between items-center mb-2">
            <div class="flex items-center space-x-2">
              <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs">
                ${authorName[0].toUpperCase()}
              </div>
              <div>
                <h2 class="font-semibold text-gray-900 text-xs">${authorName}</h2>
                <span class="text-[10px] text-gray-400">Score: ${Math.round(post.score)}</span>
              </div>
            </div>
            <div class="space-x-1 text-xs text-gray-400">
              <button onclick="hidePost('${post.id}')" title="Hide Post" class="hover:text-gray-600 p-1"><i class="fa-solid fa-eye-slash"></i></button>
              ${isOwner ? `
                <button onclick="editPost('${post.id}', '${post.textContent}')" class="hover:text-blue-600 p-1"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deletePost('${post.id}')" class="hover:text-red-600 p-1"><i class="fa-solid fa-trash"></i></button>
              ` : ''}
            </div>
          </div>

          <p class="text-sm text-gray-800 mb-2 whitespace-pre-line">${post.textContent}</p>

          ${totalReactions > 0 ? `
            <div class="flex items-center space-x-1 text-xs text-gray-500 py-1 border-b">
              <span>${Object.keys(reactionCounts).map(r => reactionIcons[r]).join('')}</span>
              <span>${totalReactions}</span>
            </div>
          ` : ''}

          <div class="flex justify-around py-1 text-xs text-gray-500 border-t mt-1">
            <div class="relative group w-full text-center py-1">
              <div class="reaction-box space-x-1">
                <button onclick="reactToPost('${post.id}', 'like')" class="hover:scale-125 transition">👍</button>
                <button onclick="reactToPost('${post.id}', 'love')" class="hover:scale-125 transition">❤️</button>
                <button onclick="reactToPost('${post.id}', 'haha')" class="hover:scale-125 transition">😆</button>
                <button onclick="reactToPost('${post.id}', 'wow')" class="hover:scale-125 transition">😮</button>
                <button onclick="reactToPost('${post.id}', 'sad')" class="hover:scale-125 transition">😢</button>
                <button onclick="reactToPost('${post.id}', 'angry')" class="hover:scale-125 transition">😡</button>
              </div>
              <button class="w-full font-semibold ${myReaction ? 'text-blue-600' : 'hover:text-blue-600'}">
                ${myReaction ? reactionIcons[myReaction] + ' ' + myReaction.toUpperCase() : '<i class="fa-regular fa-thumbs-up"></i> Like'}
              </button>
            </div>

            <button onclick="toggleCommentBox('${post.id}')" class="w-full text-center py-1 font-semibold hover:text-blue-600">
              <i class="fa-regular fa-comment"></i> Comment
            </button>
            <button onclick="sharePost('${post.id}')" class="w-full text-center py-1 font-semibold hover:text-blue-600">
              <i class="fa-solid fa-share"></i> Share
            </button>
          </div>

          <div id="comments-${post.id}" class="hidden pt-2 border-t mt-2 space-y-2">
            <div class="flex space-x-2">
              <input type="text" id="comment-input-${post.id}" placeholder="Write a comment..." class="w-full bg-gray-100 rounded-full px-3 py-1 text-xs outline-none border focus:bg-white">
              <button onclick="addComment('${post.id}')" class="bg-blue-600 text-white px-3 py-1 rounded-xs text-xs font-semibold">Send</button>
            </div>
            <div id="comment-list-${post.id}" class="space-y-1.5 pt-1"></div>
          </div>
        </article>
      `;
      postsContainer.innerHTML += postHtml;
    }

    window.hidePost = async (postId) => {
      if (!currentUser) return;
      userProfile.hiddenPosts.push(postId);
      document.getElementById(`post-card-${postId}`)?.remove();
      try {
        await updateDoc(doc(db, "users", currentUser.uid), { hiddenPosts: arrayUnion(postId) });
      } catch (e) {
        console.error("Error hiding post:", e);
      }
    };

    window.createPost = async () => {
      const text = document.getElementById('post-input').value;
      if (!text.trim()) return;

      try {
        await addDoc(collection(db, "posts"), {
          textContent: text,
          authorId: currentUser.uid,
          userName: currentUser.displayName || currentUser.email.split('@')[0],
          reactions: {},
          commentCount: 0,
          shareCount: 0,
          createdAt: serverTimestamp()
        });
        document.getElementById('post-input').value = "";
        loadPersonalizedFeed(true);
      } catch (error) {
        alert("Error posting: " + error.message);
      }
    };

    window.deletePost = async (postId) => {
      if (confirm("Delete this post?")) {
        try {
          await deleteDoc(doc(db, "posts", postId));
          document.getElementById(`post-card-${postId}`)?.remove();
        } catch (e) {
          alert("Delete failed: " + e.message);
        }
      }
    };

    window.editPost = async (postId, currentText) => {
      const newText = prompt("Edit your post:", currentText);
      if (newText && newText.trim() !== currentText) {
        try {
          await updateDoc(doc(db, "posts", postId), { textContent: newText });
          loadPersonalizedFeed(true);
        } catch (e) {
          alert("Edit failed: " + e.message);
        }
      }
    };

    window.reactToPost = async (postId, reactionType) => {
      if (!currentUser) return;
      try {
        await updateDoc(doc(db, "posts", postId), { [`reactions.${currentUser.uid}`]: reactionType });
      } catch (e) {
        console.error("Reaction error:", e);
      }
    };

    window.toggleCommentBox = (postId) => {
      document.getElementById(`comments-${postId}`)?.classList.toggle('hidden');
    };

    window.addComment = async (postId) => {
      const input = document.getElementById(`comment-input-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      try {
        await addDoc(collection(db, "posts", postId, "comments"), {
          text: text,
          authorId: currentUser.uid,
          userName: currentUser.displayName || currentUser.email.split('@')[0],
          createdAt: serverTimestamp()
        });
        await updateDoc(doc(db, "posts", postId), { commentCount: increment(1) });
        input.value = "";
      } catch (e) {
        alert("Comment failed: " + e.message);
      }
    };

    window.sharePost = async (postId) => {
      navigator.clipboard.writeText(window.location.href);
      try {
        await updateDoc(doc(db, "posts", postId), { shareCount: increment(1) });
        alert("Post link copied to clipboard!");
      } catch (e) {
        console.error("Share count error:", e);
      }
    };

    // Reels Logic
    window.openUploadModal = () => {
      document.getElementById('reel-upload-modal').classList.remove('hidden');
    };
    window.closeUploadModal = () => {
      document.getElementById('reel-upload-modal').classList.add('hidden');
    };

    window.uploadReel = async () => {
      const videoUrl = document.getElementById('reel-video-url').value.trim();
      const caption = document.getElementById('reel-caption').value.trim();

      if (!videoUrl) return alert("Please enter a valid video URL.");

      try {
        await addDoc(collection(db, "reels"), {
          videoUrl: videoUrl,
          caption: caption || "",
          authorId: currentUser.uid,
          authorName: currentUser.displayName || currentUser.email.split('@')[0],
          likes: {},
          createdAt: serverTimestamp()
        });
        document.getElementById('reel-video-url').value = "";
        document.getElementById('reel-caption').value = "";
        closeUploadModal();
        loadReelsFeed();
        alert("Reel uploaded successfully!");
      } catch (e) {
        alert("Upload failed: " + e.message);
      }
    };

    window.loadReelsFeed = async () => {
      const container = document.getElementById('reels-container');
      if (!container) return;

      try {
        const q = query(collection(db, "reels"), orderBy("createdAt", "desc"), limit(10));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          container.innerHTML = `<div class="h-full flex items-center justify-center text-gray-400 text-xs">No reels found. Be the first to upload!</div>`;
          return;
        }

        container.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const reel = docSnap.data();
          const reelId = docSnap.id;
          const likesCount = Object.keys(reel.likes || {}).length;
          const isLiked = currentUser && reel.likes && reel.likes[currentUser.uid];

          const reelHtml = `
            <div class="h-full w-full snap-start relative flex items-center justify-center bg-black">
              <video src="${reel.videoUrl}" class="h-full w-full object-cover" loop autoplay muted playsinline onclick="this.paused ? this.play() : this.pause()"></video>

              <div class="absolute bottom-4 left-4 right-16 text-white z-20 space-y-1">
                <div class="flex items-center space-x-2">
                  <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs">
                    ${(reel.authorName || 'U')[0].toUpperCase()}
                  </div>
                  <span class="font-bold text-xs">${reel.authorName}</span>
                </div>
                <p class="text-xs text-gray-200 line-clamp-2">${reel.caption}</p>
              </div>

              <div class="absolute bottom-6 right-3 z-20 flex flex-col items-center space-y-4 text-white">
                <button onclick="likeReel('${reelId}')" class="flex flex-col items-center space-y-1">
                  <div class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center ${isLiked ? 'text-red-500' : 'text-white'}">
                    <i class="fa-solid fa-heart text-lg"></i>
                  </div>
                  <span class="text-[10px] font-semibold">${likesCount}</span>
                </button>
                <button class="flex flex-col items-center space-y-1">
                  <div class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center">
                    <i class="fa-solid fa-comment text-base"></i>
                  </div>
                  <span class="text-[10px] font-semibold">0</span>
                </button>
                <button onclick="shareReel()" class="flex flex-col items-center space-y-1">
                  <div class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center">
                    <i class="fa-solid fa-share text-base"></i>
                  </div>
                  <span class="text-[10px] font-semibold">Share</span>
                </button>
              </div>
            </div>
          `;
          container.innerHTML += reelHtml;
        });
      } catch (e) {
        console.error("Error loading reels:", e);
        container.innerHTML = `<div class="h-full flex items-center justify-center text-red-400 text-xs">Failed to load reels.</div>`;
      }
    };

    window.likeReel = async (reelId) => {
      if (!currentUser) return;
      try {
        const reelRef = doc(db, "reels", reelId);
        await updateDoc(reelRef, {
          [`likes.${currentUser.uid}`]: true
        });
        loadReelsFeed();
      } catch (e) {
        console.error("Like reel error:", e);
      }
    };

    window.shareReel = () => {
      navigator.clipboard.writeText(window.location.href);
      alert("Reel link copied!");
    };

    window.switchTab = (tabName) => {
      ['home', 'reels', 'friends', 'notifications', 'settings'].forEach(t => {
        document.getElementById('view-' + t)?.classList.add('hidden');
        document.getElementById('nav-' + t)?.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
      });
      document.getElementById('view-' + tabName)?.classList.remove('hidden');
      document.getElementById('nav-' + tabName)?.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');

      if (tabName === 'reels') {
        loadReelsFeed();
      }
    };
  </script>
</body>
</html>
