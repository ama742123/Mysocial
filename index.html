<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mysocial - Social Media App</title>
  
  <!-- Web App Manifest Link -->
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* প্রতিক্রিয়া বক্সের অ্যানিমেশন ও পপ-আপ স্টাইল */
    .reaction-box {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0;
      background: white;
      border-radius: 9999px;
      padding: 4px 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 20;
    }
    .group:hover .reaction-box {
      display: flex;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-12">

  <!-- ================= হেডার ও টপ নেভিগেশন ================= -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="px-4 py-2.5 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-blue-600 tracking-wide">mysocial</h1>
      <div class="flex space-x-2 items-center">
        <span id="user-display-name" class="text-xs font-semibold text-gray-600"></span>
        <button id="logout-btn" onclick="handleLogout()" class="hidden text-xs bg-red-100 text-red-600 px-2.5 py-1 rounded-md font-semibold">Logout</button>
      </div>
    </div>

    <!-- টপ নেভিগেশন বার -->
    <nav class="flex justify-around border-t border-gray-100 text-gray-500 font-medium">
      <button onclick="switchTab('home')" id="nav-home" class="w-full py-2.5 text-blue-600 border-b-2 border-blue-600 flex justify-center items-center">
        <i class="fa-solid fa-house text-xl"></i>
      </button>
      <button onclick="switchTab('reels')" id="nav-reels" class="w-full py-2.5 hover:text-blue-600 flex justify-center items-center">
        <i class="fa-solid fa-clapperboard text-xl"></i>
      </button>
      <button onclick="switchTab('friends')" id="nav-friends" class="w-full py-2.5 hover:text-blue-600 flex justify-center items-center">
        <i class="fa-solid fa-user-group text-xl"></i>
      </button>
      <button onclick="switchTab('notifications')" id="nav-notif" class="w-full py-2.5 hover:text-blue-600 flex justify-center items-center">
        <i class="fa-solid fa-bell text-xl"></i>
      </button>
      <button onclick="switchTab('settings')" id="nav-settings" class="w-full py-2.5 hover:text-blue-600 flex justify-center items-center">
        <i class="fa-solid fa-gear text-xl"></i>
      </button>
    </nav>
  </header>

  <!-- ================= সম্পূর্ণ অথেনটিকেশন ফর্ম (Login / Register) ================= -->
  <div id="auth-container" class="max-w-md mx-auto my-6 p-6 bg-white rounded-xl shadow-sm border border-gray-100">
    <div class="text-center mb-5">
      <h2 class="text-2xl font-extrabold text-blue-600" id="auth-title">Welcome to mysocial</h2>
      <p class="text-xs text-gray-500 mt-1" id="auth-subtitle">Connect with friends and the world around you.</p>
    </div>
    
    <div class="space-y-3.5">
      <div id="name-field" class="hidden">
        <input type="text" id="auth-name" placeholder="Full Name" class="w-full border border-gray-300 px-3.5 py-2 rounded-lg text-sm outline-none focus:border-blue-600">
      </div>

      <div>
        <input type="text" id="auth-email-phone" placeholder="Email address or Mobile number" class="w-full border border-gray-300 px-3.5 py-2 rounded-lg text-sm outline-none focus:border-blue-600">
      </div>

      <div class="relative">
        <input type="password" id="auth-password" placeholder="Password" class="w-full border border-gray-300 px-3.5 py-2 rounded-lg text-sm outline-none focus:border-blue-600 pr-10">
        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600 text-sm">
          <i id="password-toggle-icon" class="fa-solid fa-eye"></i>
        </button>
      </div>
      
      <button onclick="handleAuth()" id="auth-submit-btn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-bold hover:bg-blue-700 transition">
        Log In
      </button>
      
      <div class="flex items-center my-3">
        <div class="flex-grow border-t border-gray-200"></div>
        <span class="px-2 text-xs text-gray-400 font-medium">OR</span>
        <div class="flex-grow border-t border-gray-200"></div>
      </div>

      <button onclick="handleGoogleLogin()" class="w-full border border-gray-300 bg-white text-gray-700 py-2.5 rounded-lg text-sm font-semibold hover:bg-gray-50 flex items-center justify-center space-x-2 transition">
        <i class="fa-brands fa-google text-red-500 text-base"></i>
        <span>Continue with Google</span>
      </button>
    </div>

    <div class="mt-5 pt-4 border-t border-gray-100 flex justify-between items-center text-xs">
      <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="text-blue-600 font-bold hover:underline">Create new account</button>
      <button onclick="showForgotPassword()" id="forgot-password-btn" class="text-gray-500 hover:text-blue-600 hover:underline">Forgot password?</button>
    </div>
  </div>

  <!-- ================= অ্যাপ কন্টেন্ট ================= -->
  <div id="app-content" class="hidden">
    <!-- ট্যাব ১: হোম ফিড -->
    <main id="view-home" class="max-w-md mx-auto p-2 space-y-3">
      
      <!-- পোস্ট করার বক্স -->
      <div class="bg-white p-3 rounded-lg shadow-sm space-y-2 border border-gray-200">
        <div class="flex items-center space-x-2">
          <div id="user-avatar" class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm">U</div>
          <input type="text" id="post-input" placeholder="What's on your mind?" data-i18n="whatIsOnYourMind" class="w-full bg-gray-100 rounded-full px-4 py-2 text-sm outline-none border hover:bg-gray-200 focus:bg-white focus:border-blue-500 transition">
        </div>
        <div class="flex justify-end pt-1">
          <button onclick="createPost()" class="bg-blue-600 text-white px-5 py-1.5 rounded-full text-xs font-bold hover:bg-blue-700 transition">Post</button>
        </div>
      </div>

      <!-- রিয়েলটাইম পোস্ট ফিড -->
      <div id="posts-container" class="space-y-3">
        <p class="text-center text-xs text-gray-400 py-4">Loading posts...</p>
      </div>
    </main>

    <!-- ট্যাব ২: রিলস -->
    <div id="view-reels" class="hidden max-w-md mx-auto h-[calc(100vh-110px)] bg-black text-center text-white flex flex-col items-center justify-center">
      <i class="fa-solid fa-clapperboard text-5xl mb-3 text-gray-400"></i>
      <p class="text-sm text-gray-300" data-i18n="reelsComingSoon">Reels video feed coming soon...</p>
    </div>

    <!-- ট্যাব ৩: ফ্রেন্ডস -->
    <div id="view-friends" class="hidden max-w-md mx-auto p-4 bg-white mt-4 rounded-lg shadow-sm text-center">
      <h2 class="text-lg font-bold" data-i18n="friendsTitle">Friend Requests</h2>
      <p class="text-sm text-gray-500 mt-2" data-i18n="noFriends">No new requests found.</p>
    </div>

    <!-- ট্যাব ৪: নোটিফিকেশন -->
    <div id="view-notifications" class="hidden max-w-md mx-auto p-4 bg-white mt-4 rounded-lg shadow-sm text-center">
      <h2 class="text-lg font-bold" data-i18n="notifTitle">Notifications</h2>
      <p class="text-sm text-gray-500 mt-2" data-i18n="noNotif">No new notifications.</p>
    </div>

    <!-- ট্যাব ৫: সেটিংস -->
    <div id="view-settings" class="hidden max-w-md mx-auto p-4 bg-white mt-4 rounded-lg shadow-sm">
      <h2 class="text-lg font-bold mb-4" data-i18n="settingsTitle">App Settings</h2>
      <div class="flex items-center justify-between py-3 border-b">
        <span class="text-sm font-medium" data-i18n="changeLanguage">Change Language:</span>
        <select id="lang-selector" onchange="changeLanguage(this.value)" class="border rounded-md px-3 py-1.5 text-sm bg-gray-50">
          <option value="en" selected>English</option>
          <option value="bn">বাংলা (Bengali)</option>
          <option value="hi">हिन्दी (Hindi)</option>
          <option value="or">ଓଡ଼ିଆ (Odia)</option>
          <option value="mr">मराठी (Marathi)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ================= Firebase SDK & App Logic ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider, 
      sendPasswordResetEmail, 
      onAuthStateChanged, 
      signOut,
      updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp, 
      doc, 
      setDoc,
      deleteDoc,
      updateDoc,
      arrayUnion,
      arrayRemove
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBPZ5J4zXZ54UX22rMryU2AT5buy5oOfNo",
      authDomain: "mysocial-7a273.firebaseapp.com",
      databaseURL: "https://mysocial-7a273-default-rtdb.firebaseio.com",
      projectId: "mysocial-7a273",
      storageBucket: "mysocial-7a273.firebasestorage.app",
      messagingSenderId: "25826997817",
      appId: "1:25826997817:web:08b203b0489469b809bfe8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isRegisterMode = false;
    let currentUser = null;

    window.togglePasswordVisibility = () => {
      const pwdInput = document.getElementById('auth-password');
      const icon = document.getElementById('password-toggle-icon');
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        pwdInput.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    };

    window.toggleAuthMode = () => {
      isRegisterMode = !isRegisterMode;
      document.getElementById('name-field').classList.toggle('hidden', !isRegisterMode);
      document.getElementById('auth-title').innerText = isRegisterMode ? "Create a new account" : "Welcome to mysocial";
      document.getElementById('auth-submit-btn').innerText = isRegisterMode ? "Sign Up" : "Log In";
      document.getElementById('toggle-auth-btn').innerText = isRegisterMode ? "Already have an account? Log In" : "Create new account";
      document.getElementById('forgot-password-btn').classList.toggle('hidden', isRegisterMode);
    };

    function parseInputToEmail(inputVal) {
      inputVal = inputVal.trim();
      if (inputVal.includes('@')) return inputVal;
      const cleanPhone = inputVal.replace(/[^0-9]/g, '');
      if (cleanPhone.length >= 10) return `${cleanPhone}@mysocial.phone`;
      return null;
    }

    window.handleAuth = async () => {
      const rawInput = document.getElementById('auth-email-phone').value;
      const password = document.getElementById('auth-password').value;
      const fullName = document.getElementById('auth-name').value.trim();

      const email = parseInputToEmail(rawInput);

      if (!email) return alert("Please enter a valid Email address or Mobile number.");
      if (!password || password.length < 6) return alert("Password must be at least 6 characters long.");

      try {
        if (isRegisterMode) {
          if (!fullName) return alert("Please enter your Full Name.");
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;
          await updateProfile(user, { displayName: fullName });
          await setDoc(doc(db, "users", user.uid), { uid: user.uid, name: fullName, email: user.email, createdAt: serverTimestamp() });
          alert("Account created successfully!");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        alert("Authentication Error: " + error.message);
      }
    };

    window.handleGoogleLogin = async () => {
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid, name: user.displayName || "Google User", email: user.email, photoURL: user.photoURL || "", createdAt: serverTimestamp()
        }, { merge: true });
      } catch (error) {
        alert("Google Login Error: " + error.message);
      }
    };

    window.showForgotPassword = async () => {
      const rawInput = prompt("Enter your registered Email address:");
      if (!rawInput) return;
      const email = parseInputToEmail(rawInput);
      if (!email || email.endsWith('@mysocial.phone')) return alert("Please enter a valid registered email address.");
      try {
        await sendPasswordResetEmail(auth, email);
        alert("Password reset email sent!");
      } catch (error) {
        alert("Error: " + error.message);
      }
    };

    window.handleLogout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('auth-container').classList.add('hidden');
        document.getElementById('app-content').classList.remove('hidden');
        document.getElementById('logout-btn').classList.remove('hidden');
        
        const showName = user.displayName || user.email.split('@')[0];
        document.getElementById('user-display-name').innerText = showName;
        document.getElementById('user-avatar').innerText = showName[0].toUpperCase();
        loadPosts();
      } else {
        document.getElementById('auth-container').classList.remove('hidden');
        document.getElementById('app-content').classList.add('hidden');
        document.getElementById('logout-btn').classList.add('hidden');
      }
    });

    // =================১. পোস্ট তৈরি (Create Post) =================
    window.createPost = async () => {
      const text = document.getElementById('post-input').value;
      if (!text.trim()) return;

      try {
        await addDoc(collection(db, "posts"), {
          textContent: text,
          userUid: currentUser.uid,
          userName: currentUser.displayName || currentUser.email.split('@')[0],
          reactions: {}, // { uid: "like" / "love" / "haha" etc }
          createdAt: serverTimestamp()
        });
        document.getElementById('post-input').value = "";
      } catch (error) {
        alert("Error posting: " + error.message);
      }
    };

    // ================= ২. পোস্ট সম্পাদনা ও মুছা (Edit & Delete) =================
    window.deletePost = async (postId) => {
      if (confirm("Are you sure you want to delete this post?")) {
        try {
          await deleteDoc(doc(db, "posts", postId));
        } catch (e) {
          alert("Delete failed: " + e.message);
        }
      }
    };

    window.editPost = async (postId, currentText) => {
      const newText = prompt("Edit your post:", currentText);
      if (newText && newText.trim() !== currentText) {
        try {
          await updateDoc(doc(db, "posts", postId), { textContent: newText });
        } catch (e) {
          alert("Edit failed: " + e.message);
        }
      }
    };

    // ================= ৩. ইমোজি প্রতিক্রিয়া (Reactions System) =================
    window.reactToPost = async (postId, reactionType) => {
      if (!currentUser) return;
      const postRef = doc(db, "posts", postId);
      try {
        await updateDoc(postRef, {
          [`reactions.${currentUser.uid}`]: reactionType
        });
      } catch (e) {
        console.error("Reaction error:", e);
      }
    };

    // ================= ৪. কমেন্ট সিস্টেম (Comments System) =================
    window.toggleCommentBox = (postId) => {
      const box = document.getElementById(`comments-${postId}`);
      box.classList.toggle('hidden');
    };

    window.addComment = async (postId) => {
      const input = document.getElementById(`comment-input-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      try {
        await addDoc(collection(db, "posts", postId, "comments"), {
          text: text,
          userUid: currentUser.uid,
          userName: currentUser.displayName || currentUser.email.split('@')[0],
          createdAt: serverTimestamp()
        });
        input.value = "";
      } catch (e) {
        alert("Comment failed: " + e.message);
      }
    };

    // ================= ৫. পোস্ট শেয়ার ও লিংক কপি =================
    window.sharePost = (postId) => {
      const dummyUrl = window.location.href;
      navigator.clipboard.writeText(dummyUrl);
      alert("Post link copied to clipboard!");
    };

    // ================= ৬. রিয়েল-টাইম পোস্ট ও কমেন্ট ফিড লোড =================
    const reactionIcons = {
      like: "👍", love: "❤️", haha: "😆", wow: "😮", sad: "😢", angry: "😡"
    };

    function loadPosts() {
      const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const postsContainer = document.getElementById('posts-container');
        postsContainer.innerHTML = "";

        if (snapshot.empty) {
          postsContainer.innerHTML = `<p class="text-center text-xs text-gray-400 py-4">No posts yet. Be the first to post!</p>`;
          return;
        }

        snapshot.forEach((docSnap) => {
          const postId = docSnap.id;
          const post = docSnap.data();
          const isOwner = currentUser && currentUser.uid === post.userUid;
          const authorName = post.userName || "User";

          // প্রতিক্রিয়ার সংখ্যা হিসাব
          const reactions = post.reactions || {};
          const reactionCounts = Object.values(reactions).reduce((acc, r) => {
            acc[r] = (acc[r] || 0) + 1;
            return acc;
          }, {});
          const totalReactions = Object.keys(reactions).length;
          const myReaction = currentUser ? reactions[currentUser.uid] : null;

          const postHtml = `
            <article class="bg-white rounded-lg shadow-sm p-3 border border-gray-200">
              <!-- পোস্টের ইউজার হেডার & অপশন -->
              <div class="flex justify-between items-center mb-2">
                <div class="flex items-center space-x-2">
                  <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs">
                    ${authorName[0].toUpperCase()}
                  </div>
                  <div>
                    <h2 class="font-semibold text-gray-900 text-xs">${authorName}</h2>
                    <span class="text-[10px] text-gray-400">Just now</span>
                  </div>
                </div>
                ${isOwner ? `
                  <div class="space-x-1 text-xs text-gray-400">
                    <button onclick="editPost('${postId}', '${post.textContent}')" class="hover:text-blue-600 p-1"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="deletePost('${postId}')" class="hover:text-red-600 p-1"><i class="fa-solid fa-trash"></i></button>
                  </div>
                ` : ''}
              </div>

              <!-- পোস্টের টেক্সট -->
              <p class="text-sm text-gray-800 mb-2 whitespace-pre-line">${post.textContent}</p>

               <!-- রিকশন সংখ্যা প্রদর্শন -->
              ${totalReactions > 0 ? `
                <div class="flex items-center space-x-1 text-xs text-gray-500 py-1 border-b">
                  <span>${Object.keys(reactionCounts).map(r => reactionIcons[r]).join('')}</span>
                  <span>${totalReactions}</span>
                </div>
              ` : ''}

              <!-- বাটন বার (Like, Comment, Share) -->
              <div class="flex justify-around py-1 text-xs text-gray-500 border-t mt-1">
                <!-- রিকশন বাটন উইথ পপ-আপ -->
                <div class="relative group w-full text-center py-1">
                  <div class="reaction-box space-x-1">
                    <button onclick="reactToPost('${postId}', 'like')" class="hover:scale-125 transition">👍</button>
                    <button onclick="reactToPost('${postId}', 'love')" class="hover:scale-125 transition">❤️</button>
                    <button onclick="reactToPost('${postId}', 'haha')" class="hover:scale-125 transition">😆</button>
                    <button onclick="reactToPost('${postId}', 'wow')" class="hover:scale-125 transition">😮</button>
                    <button onclick="reactToPost('${postId}', 'sad')" class="hover:scale-125 transition">😢</button>
                    <button onclick="reactToPost('${postId}', 'angry')" class="hover:scale-125 transition">😡</button>
                  </div>
                  <button class="w-full font-semibold ${myReaction ? 'text-blue-600' : 'hover:text-blue-600'}">
                    ${myReaction ? reactionIcons[myReaction] + ' ' + myReaction.toUpperCase() : '<i class="fa-regular fa-thumbs-up"></i> Like'}
                  </button>
                </div>

                <button onclick="toggleCommentBox('${postId}')" class="w-full text-center py-1 font-semibold hover:text-blue-600">
                  <i class="fa-regular fa-comment"></i> Comment
                </button>
                <button onclick="sharePost('${postId}')" class="w-full text-center py-1 font-semibold hover:text-blue-600">
                  <i class="fa-solid fa-share"></i> Share
                </button>
              </div>

              <!-- কমেন্ট সেকশন -->
              <div id="comments-${postId}" class="hidden pt-2 border-t mt-2 space-y-2">
                <div class="flex space-x-2">
                  <input type="text" id="comment-input-${postId}" placeholder="Write a comment..." class="w-full bg-gray-100 rounded-full px-3 py-1 text-xs outline-none border focus:bg-white">
                  <button onclick="addComment('${postId}')" class="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-semibold">Send</button>
                </div>
                <!-- কমেন্টের তালিকা -->
                <div id="comment-list-${postId}" class="space-y-1.5 pt-1"></div>
              </div>
            </article>
          `;
          postsContainer.innerHTML += postHtml;
          loadComments(postId);
        });
      });
    }

    // নির্দিষ্ট পোস্টের কমেন্ট লোড করার লজিক
    function loadComments(postId) {
      const q = query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc"));
      onSnapshot(q, (snapshot) => {
        const listDiv = document.getElementById(`comment-list-${postId}`);
        if (!listDiv) return;
        listDiv.innerHTML = "";

        snapshot.forEach((cDoc) => {
          const c = cDoc.data();
          listDiv.innerHTML += `
            <div class="bg-gray-50 p-2 rounded-lg text-xs">
              <span class="font-bold text-gray-900">${c.userName || "User"}: </span>
              <span class="text-gray-700">${c.text}</span>
            </div>
          `;
        });
      });
    }

    // ল্যাঙ্গুয়েজ ও ট্যাব স্ব্যাপ
    const translations = {
      en: { whatIsOnYourMind: "What's on your mind?", reelsComingSoon: "Reels video feed coming soon...", friendsTitle: "Friend Requests", noFriends: "No new requests found.", notifTitle: "Notifications", noNotif: "No new notifications.", settingsTitle: "App Settings", changeLanguage: "Change Language:" },
      bn: { whatIsOnYourMind: "আপনার মনে কি আছে?", reelsComingSoon: "রিলস ভিডিও ফিড খুব শীঘ্রই আসছে...", friendsTitle: "ফ্রেন্ড রিকোয়েস্ট", noFriends: "কোনো নতুন রিকোয়েস্ট নেই।", notifTitle: "নোটিফিকেশন", noNotif: "কোনো নতুন নোটিফিকেশন নেই।", settingsTitle: "অ্যাপ সেটিংস", changeLanguage: "ভাষা পরিবর্তন করুন:" }
    };

    window.changeLanguage = (lang) => {
      document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.getAttribute("data-i18n");
        if (translations[lang] && translations[lang][key]) {
          if (element.tagName === "INPUT") element.placeholder = translations[lang][key];
          else element.innerText = translations[lang][key];
        }
      });
    };

    window.switchTab = (tabName) => {
      ['home', 'reels', 'friends', 'notifications', 'settings'].forEach(t => {
        document.getElementById('view-' + t)?.classList.add('hidden');
        document.getElementById('nav-' + t)?.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
      });
      document.getElementById('view-' + tabName)?.classList.remove('hidden');
      document.getElementById('nav-' + tabName)?.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
    };
  </script>
</body>
</html>
